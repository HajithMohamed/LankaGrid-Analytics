name: Scheduled Data Warehouse Refresh

on:
  schedule:
    # Run daily at 02:00 UTC (07:30 Asia/Colombo) for PUCSL dispatch, CEB digests, and NASA observations
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to refresh"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ceb
          - pucsl
          - nasa
      force:
        description: "Force re-processing of already recorded source files"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scheduled-warehouse-refresh
  cancel-in-progress: false

jobs:
  refresh-warehouse:
    name: Incremental Acquisition & Mart Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate DATABASE_URL Secret Presence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Missing required GitHub Actions secret 'DATABASE_URL'. Configure the authorized Supabase PostgreSQL connection string under Settings -> Secrets and variables -> Actions before running scheduled ingestion."
            exit 1
          fi
          case "${DATABASE_URL}" in
            *localhost*|*127.0.0.1*|*\[YOUR-PASSWORD\]*|*\<project-ref\>*)
              echo "::error::DATABASE_URL points to localhost or contains an unreplaced template placeholder. Scheduled production runs must connect to the remote Supabase PostgreSQL instance."
              exit 1
              ;;
          esac
          echo "DATABASE_URL secret verified present and non-local."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Supabase Connectivity, TLS, Schemas & Migrations (Read-Only Preflight)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_SSLMODE: "require"
          SCHEDULED_PRODUCTION_REFRESH: "true"
        run: |
          python scripts/refresh_warehouse.py --preflight-only --require-remote

      - name: Run Incremental Source Acquisition & Warehouse Refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_SSLMODE: "require"
          SCHEDULED_PRODUCTION_REFRESH: "true"
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          DATASET="${{ github.event.inputs.dataset || 'all' }}"
          python scripts/refresh_warehouse.py --dataset "$DATASET" --acquire --require-remote $FORCE_FLAG --verbose

      - name: Verify Analytical Marts Health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_SSLMODE: "require"
        run: |
          python scripts/migrate_supabase.py --verify-only

      - name: Archive Raw Provenance Manifest & Acquired Source Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-provenance-archive-${{ github.run_id }}
          path: |
            data/raw/manifest.json
            data/raw/nasa/daily/*.json
            data/raw/pucsl/**/*.xlsx
            data/raw/ceb/**/*.pdf
          if-no-files-found: ignore
          retention-days: 90

