name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
      - "chore/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: python -m ruff check .

      - name: Run Ruff Format Check
        run: python -m ruff format --check .

      - name: Run Mypy Type Check
        run: python -m mypy src scripts

  unit-tests:
    name: Unit & Data Quality Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit and Data Quality Tests
        run: python -m pytest tests/unit tests/data_quality -v

  integration-tests:
    name: Database Migrations & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sl_grid_warehouse
          POSTGRES_USER: grid_admin
          POSTGRES_PASSWORD: grid_dev_password_change_me
          TZ: Asia/Colombo
          PGTZ: Asia/Colombo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grid_admin -d sl_grid_warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sl_grid_warehouse
      POSTGRES_USER: grid_admin
      POSTGRES_PASSWORD: grid_dev_password_change_me
      POSTGRES_TEST_DB: sl_grid_warehouse_test
      POSTGRES_TEST_USER: grid_admin
      POSTGRES_TEST_PASSWORD: grid_dev_password_change_me

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create Test Database
        run: |
          PGPASSWORD=grid_dev_password_change_me psql -h localhost -U grid_admin -d sl_grid_warehouse -c "CREATE DATABASE sl_grid_warehouse_test OWNER grid_admin;"

      - name: Apply Database Migrations (Main DB)
        run: python scripts/migrate.py up

      - name: Seed Reference Dimensions (Main DB)
        run: python scripts/seed_reference.py

      - name: Apply Database Migrations & Seeds (Test DB)
        env:
          POSTGRES_DB: sl_grid_warehouse_test
        run: |
          python scripts/migrate.py up
          python scripts/seed_reference.py

      - name: Run Integration Tests
        run: python -m pytest tests/integration -v

