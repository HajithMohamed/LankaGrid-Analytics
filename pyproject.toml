[project]
name = "sl-national-grid-warehouse"
version = "0.1.0"
description = "National Electricity Grid Analytics Data Warehouse — Sri Lanka"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "National Grid Warehouse Team", email = "group@gridwarehouse.lk" }
]
dependencies = [
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pandas>=2.2.0,<3.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "pypdf>=4.2.0,<6.0.0",
    "requests>=2.32.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-requests>=2.32.0.20240523",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests (fast, no external services)",
    "integration: Integration tests requiring active PostgreSQL",
    "data_quality: Data quality and schema validation tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line length handled by formatter
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

explicit_package_bases = true
